{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back!</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

<main class="login-container">

    <section class="login-card">

        <h1>WELCOME BACK!</h1>

        <form method="POST" novalidate>
            {% csrf_token %}

            {% for e in form.non_field_errors %}
                <p class="error">{{ e }}</p>
            {% endfor %}

            <div class="field">
                <input
                    type="email"
                    name="username"
                    placeholder="Email:"
                    value="{{ request.POST.username|default:'' }}"
                    required
                >
            </div>

            <div class="field password-field">
                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password:"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword()"
                    aria-label="Toggle password visibility"
                >
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg"
                         width="23" height="23" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <div class="forgot-password">
                <a href="#">Forgot Password</a>
            </div>

            <button type="submit" class="btn-primary">
                Sign In
            </button>

        </form>

        <div class="divider">OR</div>

        <a href="#" class="google-btn">
            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google"
            >
            <span>Log in with Google</span>
        </a>

        <p class="terms">
            By continuing, you agree to our updated
            <a href="#">Terms and Conditions</a> and
            <a href="#">Privacy Policy</a>.
        </p>

        <p class="register-link">
            Don't have an account??
            <a href="{% url 'register' %}">Register here.</a>
        </p>

    </section>

</main>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const icon = document.getElementById("eye-icon");

    if (password.type === "password") {
        password.type = "text";
        icon.innerHTML = `
            <path d="M3 3l18 18"/>
            <path d="M10.6 10.6a2 2 0 002.8 2.8"/>
            <path d="M9.9 5.2A11 11 0 0112 5c6.5 0 10 7 10 7a14 14 0 01-3 3.8"/>
            <path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7c1.3 0 2.5-.3 3.6-.8"/>
        `;
    } else {
        password.type = "password";
        icon.innerHTML = `
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
        `;
    }
}
</script>

</body>
</html>
