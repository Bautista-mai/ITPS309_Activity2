{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body>
  <main class="card">
    <h1>LOG IN</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for e in form.non_field_errors %}<p class="error">{{ e }}</p>{% endfor %}
      <div class="field">
        <input type="email" name="username" placeholder="Email" required>
      </div>
      <div class="field">
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn-primary">Log In</button>
    </form>
    <p class="login-link">No account yet? <a href="{% url 'register' %}">Sign up here.</a></p>
  </main>
</body>
</html>
